<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Pronóstico – Análisis</title>
    <style>
        *{box-sizing: border-box;}
        body{
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f0;
            color: #1a1a1a;
            min-height: 100vh;
            margin: 0;
        }
        .encabezado{
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo{
            width: 38px;
            height: 38px;
            background: #1D9E75;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .nombre-marca{
            font-weight: 700;
            font-size: 18px;
        }
        .contenedor{
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .boton{
            width: 100%;
            padding: 14px;
            background: #1D9E75;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .resultado{
            margin-top: 20px;
            padding: 16px;
            background: white;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <header class="encabezado">
        <div class="logo">⚽</div>
        <div class="nombre-marca">Zona Pronóstico</div>
    </header>

    <main class="contenedor">
        <button class="boton" onclick="analizarPartido()">Analizar Partido</button>
        <div id="resultado" class="resultado"></div>
    </main>

    <script>
        async function analizarPartido(){
            const resultado = document.getElementById('resultado');
            resultado.style.display = 'block';
            resultado.innerHTML = 'Cargando análisis...';
            
            try {
                // Aquí va tu código de API
                resultado.innerHTML = 'Análisis completado correctamente ✅';
            } catch(e){
                resultado.innerHTML = 'No se pudo obtener análisis';
            }
        }
    </script>
</body>
</html>
