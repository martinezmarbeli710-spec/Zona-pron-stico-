<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zona Pronóstico — Análisis de Fútbol con IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .header {
      background: #fff;
      border-bottom: 1px solid #e5e5e0;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      width: 38px;
      height: 38px;
      background: #1D9E75;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .brand-sub {
      font-size: 11px;
      color: #888;
      margin-top: 1px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #e5e5e0;
      padding: 16px;
      margin-bottom: 12px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    select, input[type=text] {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #e0e0da;
      border-radius: 10px;
      background: #fafaf8;
      color: #1a1a1a;
      appearance: none;
      outline: none;
      transition: border-color 0.15s;
    }

    select:focus, input[type=text]:focus {
      border-color: #1D9E75;
    }

    .mercados {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .mercado-btn {
      padding: 10px 6px;
      font-size: 12px;
      border: 1px solid #e0e0da;
      border-radius: 10px;
      background: #fafaf8;
      color: #666;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      line-height: 1.4;
    }

    .mercado-btn .icon { font-size: 18px; display: block; margin-bottom: 4px; }

    .mercado-btn.active {
      background: #e8f7f1;
      border-color: #1D9E75;
      color: #0F6E56;
      font-weight: 600;
    }

    .mercado-btn:hover:not(.active) {
      background: #f5f5f0;
      border-color: #ccc;
    }

    .btn-analizar {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      background: #1D9E75;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-analizar:hover { background: #178a65; }
    .btn-analizar:active { transform: scale(0.98); }
    .btn-analizar:disabled { background: #9FE1CB; cursor: not-allowed; }

    .result-card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #e5e5e0;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .result-header {
      padding: 11px 14px;
      background: #f5f5f0;
      border-bottom: 1px solid #e5e5e0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .result-header span { color: #1D9E75; font-size: 16px; }

    .result-body {
      padding: 16px;
      font-size: 14px;
      color: #1a1a1a;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .badge-green { background: #e8f7f1; color: #0F6E56; }
    .badge-amber { background: #FEF3E2; color: #854F0B; }
    .badge-red   { background: #FEE8E8; color: #A32D2D; }

    .typing {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 20px 16px;
      font-size: 13px;
      color: #888;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #1D9E75;
      animation: bounce 1s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-7px); }
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      padding: 14px 16px;
      font-size: 13px;
      color: #A32D2D;
      background: #FEE8E8;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .disclaimer {
      font-size: 11px;
      color: #aaa;
      text-align: center;
      padding: 8px 16px 24px;
      line-height: 1.6;
    }

    .nueva-consulta {
      width: 100%;
      padding: 11px;
      font-size: 14px;
      font-weight: 500;
      background: transparent;
      color: #1D9E75;
      border: 1px solid #1D9E75;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background 0.15s;
    }
    .nueva-consulta:hover { background: #e8f7f1; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">⚽</div>
  <div>
    <div class="brand-name">Zona Pronóstico</div>
    <div class="brand-sub">Análisis con inteligencia artificial</div>
  </div>
</div>

<div class="container">

  <div class="card">
    <div class="section-label">Liga</div>
    <select id="liga">
      <option value="">Selecciona una liga...</option>
      <option value="Liga BetPlay (Colombia)">⚽ Liga BetPlay — Colombia</option>
      <option value="Premier League (Inglaterra)">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League — Inglaterra</option>
      <option value="La Liga (España)">🇪🇸 La Liga — España</option>
      <option value="Champions League (Europa)">🏆 Champions League — Europa</option>
      <option value="Serie A (Italia)">🇮🇹 Serie A — Italia</option>
      <option value="Bundesliga (Alemania)">🇩🇪 Bundesliga — Alemania</option>
      <option value="Bundesliga de Austria">🇦🇹 Bundesliga — Austria</option>
      <option value="Ligat Ha'al (Israel)">🇮🇱 Ligat Ha'al — Israel</option>
      <option value="Indian Super League (India)">🇮🇳 Indian Super League — India</option>
    </select>
  </div>

  <div class="card">
    <div class="section-label">Partido</div>
    <input type="text" id="partido" placeholder="Ej: Nacional vs Millonarios" />
  </div>

  <div class="card">
    <div class="section-label">Mercado a analizar</div>
    <div class="mercados">
      <button class="mercado-btn active" data-m="Goles (Over/Under)">
        <span class="icon">⚽</span>Goles
      </button>
      <button class="mercado-btn" data-m="Córneres">
        <span class="icon">🚩</span>Córneres
      </button>
      <button class="mercado-btn" data-m="Tarjetas">
        <span class="icon">🟨</span>Tarjetas
      </button>
      <button class="mercado-btn" data-m="Resultado final (1X2)">
        <span class="icon">🏆</span>Resultado
      </button>
      <button class="mercado-btn" data-m="Ambos equipos anotan (BTTS)">
        <span class="icon">🔄</span>BTTS
      </button>
      <button class="mercado-btn" data-m="Hándicap asiático">
        <span class="icon">📊</span>Hándicap
      </button>
    </div>

    <button class="btn-analizar" id="btnAnalizar" onclick="analizar()">
      ✨ Analizar partido
    </button>
  </div>

  <div id="resultado"></div>

  <div class="disclaimer">
    Zona Pronóstico es una herramienta de análisis informativo.<br>
    Las apuestas implican riesgo. Juega con responsabilidad.
  </div>

</div>

<script>
  const API_KEY = "AIzaSyAm-iPt2dp4QvBSgOGnxPZ6aVSW5qf1of0";
  let mercadoActivo = "Goles (Over/Under)";

  document.querySelectorAll('.mercado-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mercado-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mercadoActivo = btn.dataset.m;
    });
  });

  async function analizar() {
    const liga = document.getElementById('liga').value;
    const partido = document.getElementById('partido').value.trim();
    const btn = document.getElementById('btnAnalizar');
    const res = document.getElementById('resultado');

    if (!liga || !partido) {
      res.innerHTML = `<div class="error-msg">⚠️ Por favor selecciona una liga e ingresa el partido.</div>`;
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Analizando con IA...';

    res.innerHTML = `<div class="result-card"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div> La IA está analizando el partido...</div></div>`;

    try {
      const prompt = `Eres un analista profesional de apuestas deportivas especializado en fútbol. Tu tarea es analizar el siguiente partido y dar una recomendación clara y fundamentada.

Liga: ${liga}
Partido: ${partido}
Mercado solicitado: ${mercadoActivo}

Genera un análisis profesional con esta estructura exacta:

1. CONTEXTO DEL PARTIDO (2-3 oraciones sobre ambos equipos, su momento actual y relevancia del partido)

2. FACTORES CLAVE (3 puntos concretos que influyen en el mercado de ${mercadoActivo})

3. RECOMENDACIÓN FINAL (una recomendación clara y específica para el mercado de ${mercadoActivo}, con nivel de confianza: ALTA, MEDIA o BAJA)

4. CUOTA MÍNIMA RECOMENDADA (sugiere una cuota mínima que haría interesante esta apuesta)

Sé directo, profesional y no uses frases genéricas. Máximo 250 palabras.`;

      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        }
      );

      const data = await response.json();
      const texto = data.candidates?.[0]?.content?.parts?.[0]?.text || "No se pudo obtener análisis.";

      const confianza = texto.includes('ALTA') ? 'alta' : texto.includes('BAJA') ? 'baja' : 'media';
      const badgeClass = confianza === 'alta' ? 'badge-green' : confianza === 'baja' ? 'badge-red' : 'badge-amber';
      const badgeText = confianza === 'alta' ? '🟢 Confianza alta' : confianza === 'baja' ? '🔴 Confianza baja' : '🟡 Confianza media';

      res.innerHTML = `
        <div class="result-card">
          <div class="result-header">
            <span>✨</span> ${partido} · ${mercadoActivo}
          </div>
          <div class="result-body">
            <span class="badge ${badgeClass}">${badgeText}</span>
            ${texto}
          </div>
        </div>
        <button class="nueva-consulta" onclick="nuevaConsulta()">+ Nueva consulta</button>`;

    } catch(e) {
      res.innerHTML = `<div class="error-msg">❌ Error al conectar con la IA. Verifica tu conexión a internet.</div>`;
    }

    btn.disabled = false;
    btn.innerHTML = '✨ Analizar partido';
  }

  function nuevaConsulta() {
    document.getElementById('partido').value = '';
    document.getElementById('liga').value = '';
    document.getElementById('resultado').innerHTML = '';
    document.getElementById('partido').focus();
  }
</script>
</body>
</html>
